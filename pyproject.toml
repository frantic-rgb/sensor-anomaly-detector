[project]
name = "h2-sensor-anomaly-detector"
version = "1.0.0"
description = "Real-time ML anomaly detection for a gaseous H₂ high-pressure test bench"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "scikit-learn==1.5.0",
    "numpy==1.26.4",
]

[tool.ruff]
line-length   = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]   # pycodestyle errors, pyflakes, isort
ignore = ["E501"]          # line length handled by formatter

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
