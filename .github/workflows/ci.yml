name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t h2-anomaly-detector .

      - name: Start container and wait for health
        run: |
          docker run -d --name demo -p 8000:8000 h2-anomaly-detector
          ready=0
          for i in $(seq 1 30); do
            sleep 3
            if curl -sf http://localhost:8000/api/status > /dev/null 2>&1; then
              echo "Server ready after $((i*3))s"
              ready=1
              break
            fi
          done
          if [ $ready -eq 0 ]; then
            echo "Server did not become ready in 90s"
            docker logs demo
            exit 1
          fi
          curl -sf http://localhost:8000/api/status
          docker stop demo
